# Test-only overlay for the release-tier browser E2E (see .github/workflows/release-tests.yml).
# A fresh deployment has no delivery destination, and the request form stays disabled until one passes its
# connection test. This stub answers the OPDS search probe with an empty Atom feed so the test can enable a
# local-ingest destination without a real library server. Never use it for a real deployment.
#
# Metadata comes from tests/release-e2e/metadata-fixture.py instead of a live public service, so the queue test
# selects the same kind of record on every run. The fixture serves HTTPS under the network alias the application
# already calls, with a throwaway certificate generated before `up` (FL_E2E_FIXTURE_CERT_DIR must hold cert.pem and
# key.pem; the workflow creates them). SSL_CERT_FILE makes the application trust only that certificate, which is
# acceptable here because the other metadata sources that would call out are switched off below.
services:
  opds-stub:
    image: nginx:1.27.5-alpine
    configs:
      - source: opds-stub-conf
        target: /etc/nginx/conf.d/default.conf

  metadata-fixture:
    image: python:3.13.17-alpine3.24
    command: ["python", "-u", "/fixture/metadata-fixture.py", "/certs/cert.pem", "/certs/key.pem"]
    volumes:
      - type: bind
        source: ./tests/release-e2e/metadata-fixture.py
        target: /fixture/metadata-fixture.py
        read_only: true
      - type: bind
        source: ${FL_E2E_FIXTURE_CERT_DIR:?Generate the fixture certificate first; see release-tests.yml}
        target: /certs
        read_only: true
    networks:
      default:
        aliases:
          - openlibrary.org
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 443), 2)"]
      interval: 2s
      timeout: 5s
      retries: 15

  family-librarian:
    environment:
      SSL_CERT_FILE: /certs/cert.pem
      MetadataProviders__Gutenberg__Enabled: "false"
      MetadataProviders__LibriVox__Enabled: "false"
    volumes:
      - type: bind
        source: ${FL_E2E_FIXTURE_CERT_DIR:?Generate the fixture certificate first; see release-tests.yml}/cert.pem
        target: /certs/cert.pem
        read_only: true
    depends_on:
      metadata-fixture:
        condition: service_healthy

configs:
  opds-stub-conf:
    content: |
      server {
        listen 80;
        location / {
          default_type application/atom+xml;
          return 200 '<feed xmlns="http://www.w3.org/2005/Atom"><title>stub</title></feed>';
        }
      }
