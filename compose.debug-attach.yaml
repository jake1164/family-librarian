# Adds the vsdbg debugger to the `family-librarian` container for the VS Code
# "docker: attach" launch configs.
#
# VS Code's own copy-on-attach prompt for this container is unreliable on
# Windows hosts (silent skips when it should copy, and tar/pipe errors when it
# does run against a fresh/starting container), so we bind-mount the
# already-downloaded vsdbg folder straight into the container at the path the
# debug adapter expects, guaranteeing it's there before VS Code even checks.
# `VSDBG_HOST_DIR` is set by the `compose: reuse container` / `compose: force
# rebuild` tasks (OS-specific — see tasks.json) and points at the linux-x64
# vsdbg install VS Code already maintains for you.
#
# Deliberately NOT read-only: VS Code still runs its own "copy the debugger?"
# check on attach and, if it decides to, `docker cp`s into this path anyway.
# A read-only mount makes that copy fail outright ("mounted volume is marked
# read-only"); writable, it just harmlessly re-copies the same files back
# into the host's own `.vsdbg` folder.
#
#   docker compose -f compose.yaml -f compose.debug-attach.yaml up -d --build --wait
services:
  family-librarian:
    volumes:
      - ${VSDBG_HOST_DIR:?Set VSDBG_HOST_DIR to your host's linux-x64 vsdbg/latest folder}:/remote_debugger
