# Builds the application container from the Dockerfile's `debug` stage, which
# already contains vsdbg at /remote_debugger, for the VS Code "Containers:
# attach" launch configs.
#
# This used to bind-mount the host's own ~/.vsdbg folder into the container
# instead. That guaranteed the debugger was present, but VS Code still ran its
# own "copy the debugger?" check on attach and, when it decided to copy, wrote
# the whole debugger back out through the mount. On Windows that means thousands
# of small files crossing the Docker Desktop filesystem bridge, which took
# minutes. Shipping the debugger in a layer removes the copy entirely, and with
# it the host-architecture detection the tasks used to need: the stage is built
# for the same platform as the container it runs in.
#
# The debug image is tagged separately so `family-librarian:dev` never silently
# becomes an image containing a debugger.
#
#   docker compose -f compose.yaml -f compose.debug-attach.yaml up -d --build --wait
services:
  family-librarian:
    build:
      context: .
      target: debug
    image: family-librarian:debug
