name: Publish Docker image to GHCR

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-alpha.*"
      - "v*.*.*-beta.*"
      - "v*.*.*-rc.*"
      - "v*.*.*-alpha-test.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags from git ref
        id: vars
        run: |
          TAG="${GITHUB_REF_NAME}"
          IMAGE="ghcr.io/${{ github.repository }}"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *"-alpha."* || "$TAG" == *"-alpha-test."* ]]; then
            echo "${IMAGE}:alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *"-beta."* ]]; then
            echo "${IMAGE}:beta" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *"-rc."* ]]; then
            echo "${IMAGE}:rc" >> "$GITHUB_OUTPUT"
          else
            echo "${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      # Builds the Dockerfile's default (last) stage, `final` — the same one
      # a bare `docker build` and the CI workflow's container-scan job
      # produce. The `debug` stage is declared earlier specifically so a
      # target-less build like this one can never select it.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: final
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.vars.outputs.tags }}
