name: Release tests

# The release tier: tests tagged TestCategory("Release") that need a real
# browser and, for BrowserRequestQueueE2ETests, a deployed Compose stack.
# Checkin CI (ci.yml) excludes them so every push stays a fast regression run.
# Deployment boundaries (CWA, Audiobookshelf, ClamAV, SMTP, external providers,
# backup/restore) are family-librarian-lab's job, not this workflow's.
on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-alpha.*"
      - "v*.*.*-beta.*"
      - "v*.*.*-rc.*"
      - "v*.*.*-alpha-test.*"
  workflow_dispatch:

concurrency:
  group: release-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  browser:
    name: Browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tests/FamilyLibrarian.Web.Tests/FamilyLibrarian.Web.Tests.csproj

      - name: Build
        run: dotnet build tests/FamilyLibrarian.Web.Tests/FamilyLibrarian.Web.Tests.csproj --no-restore

      # Playwright's browser binary is installed explicitly for this Linux
      # runner; the package itself does not ship one.
      - name: Install Playwright Chromium
        run: pwsh tests/FamilyLibrarian.Web.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # compose.release-e2e.yaml serves deterministic metadata over HTTPS from a
      # test-only fixture. Its certificate is generated per run and never
      # committed; it is trusted only inside this disposable deployment.
      - name: Generate metadata fixture certificate
        run: |
          mkdir -p "$RUNNER_TEMP/release-e2e-certs"
          cert_dir="$RUNNER_TEMP/release-e2e-certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=openlibrary.org" -addext "subjectAltName=DNS:openlibrary.org" -keyout "$cert_dir/key.pem" -out "$cert_dir/cert.pem"
          chmod 644 "$RUNNER_TEMP/release-e2e-certs/"*.pem

      # BrowserRequestQueueE2ETests deliberately exercises a deployed Compose
      # application rather than an in-process host. These credentials exist
      # only for this fresh, isolated CI database and are not deployment
      # secrets.
      - name: Start browser E2E deployment
        timeout-minutes: 10
        env:
          FL_DB_PASSWORD: ci-browser-e2e-database-only
          ADMIN_EMAIL: browser-e2e-admin@family-librarian.example
          ADMIN_PASSWORD: Browser-E2E-CI-Only-Password1!
          FL_E2E_FIXTURE_CERT_DIR: ${{ runner.temp }}/release-e2e-certs
        run: docker compose -f compose.yaml -f compose.release-e2e.yaml --project-name family-librarian-browser-e2e up --build --wait --wait-timeout 120

      - name: Test
        timeout-minutes: 12
        env:
          FAMILY_LIBRARIAN_LIVE_BROWSER_TESTS: "1"
          FAMILY_LIBRARIAN_SETTINGS_BROWSER_TESTS: "1"
          FAMILY_LIBRARIAN_AI_DIAGNOSTICS_BROWSER_TESTS: "1"
          FAMILY_LIBRARIAN_CATALOG_BROWSE_BROWSER_TESTS: "1"
          FAMILY_LIBRARIAN_SOURCE_LOOKUP_BROWSER_TESTS: "1"
          FAMILY_LIBRARIAN_CHAT_ANSWER_BROWSER_TESTS: "1"
          FAMILY_LIBRARIAN_SEARCH_BROWSER_TESTS: "1"
          FAMILY_LIBRARIAN_E2E_BASE_URL: http://localhost:8080
          FAMILY_LIBRARIAN_E2E_ADMIN_EMAIL: browser-e2e-admin@family-librarian.example
          FAMILY_LIBRARIAN_E2E_ADMIN_PASSWORD: Browser-E2E-CI-Only-Password1!
        run: >-
          dotnet test --project tests/FamilyLibrarian.Web.Tests/FamilyLibrarian.Web.Tests.csproj --no-build --
          --filter "TestCategory=Release" --timeout 10m --report-trx
          --results-directory "${{ runner.temp }}/release-test-results"
          --diagnostic --diagnostic-output-directory "${{ runner.temp }}/release-test-results"
          --output Detailed --show-stdout Failed --show-stderr Failed

      # Collect before tearing down: a failed/timed-out test still needs its
      # partial results and the deployment's logs for diagnosis.
      - name: Collect deployment diagnostics
        if: always()
        timeout-minutes: 1
        env:
          FL_DB_PASSWORD: ci-browser-e2e-database-only
          ADMIN_EMAIL: browser-e2e-admin@family-librarian.example
          ADMIN_PASSWORD: Browser-E2E-CI-Only-Password1!
          FL_E2E_FIXTURE_CERT_DIR: ${{ runner.temp }}/release-e2e-certs
        run: |
          mkdir -p "$RUNNER_TEMP/release-test-results"
          docker compose -f compose.yaml -f compose.release-e2e.yaml --project-name family-librarian-browser-e2e ps --all > "$RUNNER_TEMP/release-test-results/compose-status.txt"
          docker compose -f compose.yaml -f compose.release-e2e.yaml --project-name family-librarian-browser-e2e logs --no-color --timestamps > "$RUNNER_TEMP/release-test-results/compose.log" 2>&1

      - name: Stop browser E2E deployment
        if: always()
        timeout-minutes: 1
        env:
          FL_DB_PASSWORD: ci-browser-e2e-database-only
          ADMIN_EMAIL: browser-e2e-admin@family-librarian.example
          ADMIN_PASSWORD: Browser-E2E-CI-Only-Password1!
          FL_E2E_FIXTURE_CERT_DIR: ${{ runner.temp }}/release-e2e-certs
        run: docker compose -f compose.yaml -f compose.release-e2e.yaml --project-name family-librarian-browser-e2e down --volumes --remove-orphans

      - name: Upload test diagnostics
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: release-browser-diagnostics
          path: ${{ runner.temp }}/release-test-results/
          retention-days: 7
