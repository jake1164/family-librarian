name: family-librarian

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: family_librarian
      POSTGRES_USER: family_librarian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_librarian -d family_librarian"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
    image: family-librarian:dev
    command: ["--migrate"]
    environment:
      ConnectionStrings__FamilyLibrarian: Host=postgres;Port=5432;Database=family_librarian;Username=family_librarian;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  family-librarian:
    # Stable local-only name used by the VS Code Docker attach configurations.
    # This service is intentionally not scaled in the development Compose stack.
    container_name: family-librarian-web
    build:
      context: .
    image: family-librarian:dev
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FamilyLibrarian: Host=postgres;Port=5432;Database=family_librarian;Username=family_librarian;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MetadataProviders__OpenLibrary__ContactEmail: ${OPENLIBRARY_CONTACT_EMAIL:-}
      MetadataProviders__OpenLibrary__RequestsPerSecond: ${OPENLIBRARY_REQUESTS_PER_SECOND:-1}
      MetadataProviders__GoogleBooks__Enabled: ${MetadataProviders__GoogleBooks__Enabled:-false}
      MetadataProviders__GoogleBooks__ApiKey: ${MetadataProviders__GoogleBooks__ApiKey:-}
      # Creates the first administrator, and only when no admin exists yet.
      # Without these the app still starts and seeds the User/Admin roles, but no
      # account exists to sign in with, so the Admin pages stay unreachable.
      BootstrapAdmin__Email: ${BootstrapAdmin__Email:-}
      BootstrapAdmin__Password: ${BootstrapAdmin__Password:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
