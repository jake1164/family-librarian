name: family-librarian

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: family_librarian
      POSTGRES_USER: family_librarian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_librarian -d family_librarian"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: final
    image: family-librarian:dev
    command: ["--migrate"]
    environment:
      ConnectionStrings__FamilyLibrarian: Host=postgres;Port=5432;Database=family_librarian;Username=family_librarian;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Required malware scanner for manual/automated file acquisition. Not
  # published to the host: only the family-librarian service reaches it, over
  # the internal Compose network. Pin this tag deliberately rather than
  # `:stable`/`:latest` — verify the current recommended release before
  # upgrading it.
  clamav:
    # No arm64 build is published for this image; force amd64 so it still
    # pulls (and runs under emulation) on Apple Silicon hosts.
    platform: linux/amd64
    image: clamav/clamav:1.4
    healthcheck:
      # freshclam's virus-database download can take minutes on a cold image;
      # the generous start_period keeps that from being reported as unhealthy.
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 180s
    volumes:
      - clamav-data:/var/lib/clamav

  family-librarian:
    # Stable local-only name used by the VS Code Docker attach configurations.
    # This service is intentionally not scaled in the development Compose stack.
    container_name: family-librarian-web
    build:
      context: .
      target: final
    image: family-librarian:dev
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FamilyLibrarian: Host=postgres;Port=5432;Database=family_librarian;Username=family_librarian;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MetadataProviders__OpenLibrary__ContactEmail: ${OPENLIBRARY_CONTACT_EMAIL:-}
      MetadataProviders__OpenLibrary__RequestsPerSecond: ${OPENLIBRARY_REQUESTS_PER_SECOND:-1}
      MetadataProviders__GoogleBooks__Enabled: ${MetadataProviders__GoogleBooks__Enabled:-false}
      MetadataProviders__GoogleBooks__ApiKey: ${MetadataProviders__GoogleBooks__ApiKey:-}
      # Creates the first administrator, and only when no admin exists yet.
      # Without these the app still starts and seeds the User/Admin roles, but no
      # account exists to sign in with, so the Admin pages stay unreachable.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Invite-link lifetime and the anonymous redemption rate limit. Both are
      # optional; the application defaults apply when they are unset.
      Invitations__LifetimeDays: ${Invitations__LifetimeDays:-7}
      Invitations__RedemptionAttemptsPerMinute: ${Invitations__RedemptionAttemptsPerMinute:-10}
      # Quarantine/processing/rejected/trusted storage zones. ClamAv__Host
      # points at the internal Compose service, never published to the host.
      Storage__RootPath: /data/family-librarian
      ClamAv__Host: clamav
      ClamAv__Port: 3310
    # Without this, `docker compose up --wait` returns the moment the container
    # is *running* — which is before Kestrel has bound the port. The VS Code
    # task then opens a browser against an app that cannot answer yet, and the
    # Blazor client sticks on "Loading Family Librarian..." until you refresh.
    #
    # The image deliberately carries no curl or wget, and `sh` here is dash,
    # which has no /dev/tcp — hence the explicit bash. /health/ready is used
    # rather than a bare port check because it also verifies the database.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "'
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    volumes:
      - family-librarian-data:/data/family-librarian
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy

volumes:
  postgres-data:
  clamav-data:
  family-librarian-data:
