<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Librarian</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <div id="app">Loading Family Librarian…</div>
    <div id="blazor-error-ui">
        An unexpected error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        window.familyLibrarian = window.familyLibrarian || {};
        window.familyLibrarian.download = (filename, bytes) => {
            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([bytes], { type: "application/octet-stream" }));
            link.download = filename;
            link.click();
            URL.revokeObjectURL(link.href);
        };
        // A plain href="#id" gets intercepted by Blazor's router and resolved
        // against the app's base URI, navigating to "/" instead of scrolling
        // within the current page. Scrolling via JS interop sidesteps the
        // router entirely.
        window.familyLibrarian.scrollToElement = (elementId) => {
            document.getElementById(elementId)?.scrollIntoView({ behavior: "smooth", block: "start" });
        };
    </script>
</body>
</html>
